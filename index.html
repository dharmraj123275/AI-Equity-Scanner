<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Equity Scanner Pro</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
}

.header{
    text-align:center;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:15px;
    margin-top:20px;
}

button{
    width:100%;
    padding:15px;
    font-size:18px;
    font-weight:bold;
    border:none;
    border-radius:10px;
    background:#16a34a;
    color:white;
    cursor:pointer;
}

.stock{
    padding:10px;
    border-bottom:1px solid #334155;
}

.buy{
    color:#22c55e;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#94a3b8;
    margin-top:25px;
}
</style>
</head>

<body>

<div class="header">
<h1>📈 AI Equity Scanner Pro</h1>
<p>NSE • SME • ETF Scanner</p>
</div>

<div class="card">
<h2>Market Status</h2>
<p>📊 Nifty : 🟢 Bullish</p>
<p>🏦 Bank Nifty : 🟢 Bullish</p>
</div>

<button onclick="scanMarket()">🚀 Scan Market</button>

<div class="card">
<h2>Top Strong Buy</h2>

<div id="result">
Waiting for Scan...
</div>

</div>

<div class="footer">
Version 1.0<br>
Built by Dharmrajsinh
</div>

<script>
function scanMarket(){

document.getElementById("result").innerHTML=`

<div class="stock buy">✅ RELIANCE</div>
<div class="stock buy">✅ HDFCBANK</div>
<div class="stock buy">✅ ICICIBANK</div>
<div class="stock buy">✅ BEL</div>
<div class="stock buy">✅ HAL</div>

`;

}
</script>

</body>
</html>
