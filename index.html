<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Equity Scanner Pro</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
font-size:38px;
}

p{
text-align:center;
color:#cbd5e1;
}

.card{
background:#1e293b;
padding:18px;
border-radius:15px;
margin-top:20px;
}

button{
width:100%;
padding:18px;
font-size:22px;
font-weight:bold;
background:#16a34a;
border:none;
border-radius:12px;
color:white;
margin-top:20px;
}

.stock{
background:#0f172a;
padding:12px;
margin-top:10px;
border-radius:10px;
border-left:5px solid #22c55e;
}

.buy{
color:#22c55e;
font-weight:bold;
}

.footer{
margin-top:40px;
text-align:center;
color:#94a3b8;
}

</style>

</head>

<body>

<h1>📈 AI Equity Scanner Pro</h1>

<p>NSE • SME • ETF Scanner</p>

<div class="card">

<h2>📊 Market Status</h2>

<p>🟢 Nifty : Bullish</p>

<p>🟢 Bank Nifty : Bullish</p>

</div>

<button onclick="scanMarket()">
🚀 Scan Market
</button>

<div class="card">

<h2>🔥 Top Strong Buy</h2>

<div id="result">

Waiting for Scan...

</div>

</div>

<div class="footer">

Version 2.0<br>

Built by Dharmrajsinh

</div>

<script>

function scanMarket(){

const stocks=[

"RELIANCE",

"HDFCBANK",

"ICICIBANK",

"BEL",

"HAL",

"TCS",

"INFY",

"SBIN",

"LT",

"AXISBANK"

];

let html="";

stocks.forEach(stock=>{

let score=Math.floor(Math.random()*31)+70;

if(score>=80){

html+=`

<div class="stock">

<div class="buy">

✅ ${stock}

</div>

AI Score : ${score}%<br>

Signal : STRONG BUY

</div>

`;

}

});

if(html==""){

html="<p>No Strong Buy Found.</p>";

}

document.getElementById("result").innerHTML=html;

}

</script>

</body>

</html>
